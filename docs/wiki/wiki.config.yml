# wiki.config.yml — machine-authoritative config for the repolore tooling.
#
# This file controls what the wiki covers and which pages should exist. It is
# read by the check scripts (scope + coverage tunables + page budget) AND by
# humans/LLMs during refresh (repo_notes + page plan). Keep it accurate —
# it is the planning surface for the wiki.

wiki:
  title: "hkb"
  page_budget: 50          # soft cap — wiki-check warns above this, never blocks

# Category order for the generated index. Uncomment to override the default:
# categories: [architecture, concepts, features, flows, decisions, gotchas, howto]

repo_notes: |
  hkb (npm: hkb-cli) is a Node >= 22.18 ESM CLI, written in TypeScript that Node runs natively, that schedules agent work. The board is one SQLite file per machine behind Prisma (~/.hkb/board.db) with a Board row per repository. The only workload kind is a Job — one agent, one brief, run to completion — claimed under a lease by a level-triggered controller (src/controller.ts) that runs it inline in a git worktree, behind a runtime seam over the Claude Agent SDK (src/runtime/). Isolation is enforced in a PreToolUse admission gate, not asked for in a prompt. GitHub is the forge (pull requests only, read through src/pulls.ts), never the board. The pre-ADR-007 GitHub-Issues kanban was deleted by ADR-009: anything in git history about refs/kb/boards, a dispatcher tick or a store seam describes code that is gone. Values in priority order: portable, frugal, performance, frictionless, flawless experience.

# Files the wiki may be distilled from. Drives wiki-coverage.mjs.
scope:
  include:
    - "bin/**"
    - "src/**"
    - "prisma/**"
    - "scripts/**"
  exclude:
    - "test/**"
    - "docs/**"
    # The Prisma client: generated, ships @ts-nocheck, not ours to explain. (A trailing
    # comment on the item itself is silently dropped by configLists in lib.mjs.)
    - "src/generated/**"

# Coverage tunables — uncomment to override the defaults baked into
# wiki-coverage.mjs (shown there in full).
coverage:
  # source_extensions: [.ts, .tsx, .cs, .py]
  # page_worthy_dirs: [functions, routes, services, controllers]
  # prune_dirs: [.git, node_modules, dist]
  # noise_patterns: ['\.(test|spec)\.[jt]s$']

# Audit tunables — read by the audit workflow's LLM session only (no script
# parses this block). Uncomment to override the defaults.
# audit:
#   horizon_days: 90         # a page audited longer ago than this is due
#   pages_per_session: 5     # the session cap (K)

# Page plan — the pages the wiki *should* eventually have.
# status: seeded = written | planned = not yet written.
# The LLM may add pages not listed here; when it does, it adds them back.
pages:
  - slug: architecture/overview
    summary: "The moving parts: a CLI over one SQLite board, a level-triggered controller that claims a Job under a lease and runs it inline, a runtime seam, and a worktree as the sandbox."
    status: seeded
  - slug: architecture/job-kind
    summary: "The first workload kind — one agent, one brief, run to completion — mapped onto Job/Pod/Lease/Namespace, with one reconcile pass and a pure retry decision."
    status: seeded
  - slug: architecture/the-loop
    summary: "hkb up runs reconcile on a 45s timer; why a controller is level-triggered rather than event-driven, why a lapsed lease is evidence and not proof, and why an operator stop is its own outcome."
    status: seeded
  - slug: architecture/runtime-layer
    summary: "run(spec) -> WorkerOutcome, with the Agent SDK as the first driver and a fake for tests; what the SDK stores so the board does not, and the three SDK behaviours that each cost a bug."
    status: seeded
  - slug: architecture/the-board
    summary: "The schema as a model: what a row of each table means, why the spec columns are nullable, what is frozen onto an Attempt at claim time and why, and the self-bootstrapping migration path."
    status: seeded
  - slug: concepts/admission-control
    summary: "Why worktree isolation and dependency ordering are injected or denied in a PreToolUse gate rather than asked for in a prompt — and the measured run where the prompt was silently ignored."
    status: seeded
  - slug: concepts/node-floor-and-type-check
    summary: "The floor is >=22.18.0, measured; why a published hkb must be JavaScript, how the publish transpile works, and what the CI matrix is for."
    status: seeded
  - slug: concepts/leases-and-liveness
    summary: "Why a lapsed lease is evidence and not proof: the three-valued alive/dead/unknown answer, the boot-time check, and why a wall clock cannot decide this across a suspend."
    status: seeded
  - slug: concepts/ceilings
    summary: "The three claim-time refusals (stopped, concurrency, budget), why none of them may stop a running worker, and why committed-but-unspent budget has to be counted."
    status: seeded
  - slug: decisions/adr-013-the-guide-is-read-not-loaded
    summary: "ADR-012 refused settingSources and named the cost; this reads the guide itself instead — a grant, from Board.repoPath, prepended as instruction — and stops workers inheriting the operator's MCP connectors."
    status: seeded
  - slug: features/watch
    summary: "The third question about the board, after \"what is true now\" and \"what happened\": tell me when something happens. Cursors rather than state, woken by the filesystem rather than polled, and resumable because an id never expires."
    status: seeded
  - slug: features/proposals
    summary: "A proposing Job writes one JSON file, a person reads it, and the controller creates the rows — the transport, the refusals, the approval, and why applying it twice creates nothing twice."
    status: seeded
  - slug: features/worktree-includes
    summary: "A worktree is a fresh checkout, so the .env the tests need is not in it — .worktreeinclude declares what to carry across, git answers both halves of the match rule (matched AND gitignored), and no pattern may reach the board."
    status: seeded
  - slug: features/declared-outputs
    summary: "The three declared outputs and the one rule over them: --export to the repository, --result onto the board as a value, --artifact beside the board as a file; why an undeclared output is litter, and the syntax each refuses before a checkout is ever made."
    status: seeded
  - slug: decisions/adr-004-roles-and-adoption
    summary: "The canonical seat taxonomy (operator/supervisor/dispatcher/worker) and the adoption ladder. SUPERSEDED by ADR-009: the dispatcher seat is gone."
    status: seeded
  - slug: decisions/adr-005-control-plane
    summary: "hkb is a control plane: a board is a namespace, a pause lives on its object, the runtime is a seam, the tick is sleep-aware. SUPERSEDED by ADR-009 for its CLI vocabulary; the model carried into ADR-007."
    status: seeded
  - slug: decisions/adr-006-local-store
    summary: "The two-tier local store (a git ref plus a SQLite index). SUPERSEDED by ADR-007."
    status: seeded
  - slug: decisions/adr-007-workload-scheduler
    summary: "hkb is a workload scheduler: one SQLite board behind Prisma, a runtime seam over the Claude Agent SDK, Job as the first kind with a reconcile loop and an admission gate; the DAG becomes a second kind; zero-dependency and no-build-step end."
    status: seeded
  - slug: decisions/adr-008-declared-outputs
    summary: "A Job declares its outputs — results for small structured values, exports for paths copied out of the worktree before teardown — and an undeclared output is litter."
    status: seeded
  - slug: decisions/adr-009-retiring-the-first-system
    summary: "The pre-ADR-007 GitHub-Issues kanban is deleted rather than migrated; kb is renamed hkb, the per-repo directory becomes .hkb/, and the tarball ships only the transpile."
    status: seeded
  - slug: decisions/adr-010-the-human-gate
    summary: "propose -> approve -> apply needs no second kind: a Job declares results, a gate suspends it once they exist, and approve resumes the session with the operator's instruction as the prompt."
    status: seeded
  - slug: decisions/adr-011-proposals-not-board-access
    summary: "A workload never writes to the board: it declares a proposal as an output, and the controller validates and applies it once an approval is recorded — which keeps the sandbox, makes the write retry-safe where an in-session API call is not, and leaves groom's apply half with the controller rather than making groom a kind."
    status: seeded
  - slug: decisions/adr-012-skills-by-grant-not-by-settings
    summary: "A worker gets a repository's skills as a granted plugin directory and never its settings: the two were measured to be separable, and a settings file is a shell command the repository author wrote."
    status: seeded
  - slug: howto/running-the-daemon
    summary: "Keep `hkb up` alive across reboots — a systemd user unit or a launchd agent around `hkb up --foreground`, where the log goes, and the restart-after-upgrade rule."
    status: seeded
  - slug: gotchas/merge-composition
    summary: "Four collisions where every PR was individually correct and CI-green: what parallel workers on one base actually collide on (shared invariants, not shared files), and why briefing fixed it where machinery could not."
    status: planned
