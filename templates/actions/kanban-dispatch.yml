# Generated by `hkb init --with-actions`. Re-running init overwrites this file.
#
# The dispatcher, in GitHub Actions: the same `hkb dispatch` tick the laptop loop runs, so the board
# keeps moving with the machine off. Events are the primary trigger — the cron below is a sweeper for
# what no event can announce (a worker that died, a `scheduled_at` that came due).
#
# Needs one repository secret: KB_TOKEN, a fine-grained PAT scoped to this repo with Issues,
# Contents, Pull requests and Actions set to read and write. `gh secret set KB_TOKEN`.
name: kanban dispatch

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["{{worker_workflow}}"]
    types: [completed]
  workflow_dispatch:
  # SWEEPER ONLY. Actions' cron floor is 5 minutes and top-of-hour schedules are routinely 15-20+
  # minutes late (and are dropped on a quiet repo after 60 days), so a tick you can feel comes from
  # the events above. Laptop-off latency is 15-75 minutes; the laptop loop is what gives 60 seconds.
  schedule:
    - cron: "*/15 * * * *"

# hkb writes with KB_TOKEN, never with GITHUB_TOKEN — the job itself needs nothing but the checkout.
permissions:
  contents: read

# One tick at a time per board, and never cancel one in flight: a cancelled tick can leave a claimed
# lock ref with no worker behind it, which then costs a stale reclaim to clear.
concurrency:
  group: kb-dispatch-{{board}}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `package-manager-cache: false`: setup-node caches npm automatically from v5 on (v6 narrowed
      # it to a package.json that names npm), and this job installs `hkb` globally rather than your
      # project's dependencies — so a cache here would be saved and restored on every tick for
      # nothing, and would fail the step outright in a repo with no lock file.
      - uses: actions/setup-node@v7
        with:
          node-version: "{{node_version}}"
          package-manager-cache: false
      - name: install hkb
        run: {{install}}

      # A pull_request from a fork gets no secrets, and a repo that has not set KB_TOKEN yet should
      # say so once instead of failing on every event.
      - id: preflight
        env:
          KB_TOKEN: ${{ secrets.KB_TOKEN }}
        run: |
          if [ -n "$KB_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KB_TOKEN is not set, so nothing was dispatched. Create a fine-grained PAT for this repo (Issues, Contents, Pull requests, Actions: read and write) and run: gh secret set KB_TOKEN"
          fi

      # --profiles is the guard that makes this safe to run beside a laptop loop: a runner claims
      # only profiles it can actually launch. Everything else about the tick — reclaim, promote,
      # reconcile, the orphan sweep — still runs for the whole board.
      - name: hkb dispatch
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.KB_TOKEN }}
        run: hkb dispatch --max 1 --board {{board}} --profiles {{profiles}}
