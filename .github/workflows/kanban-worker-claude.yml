# Generated by `hkb init --with-actions`. Re-running init overwrites this file.
#
# One attempt on one task, in Actions. Nothing here decides what to work on: the dispatcher starts it
# with the `claude-action` profile's launch —
#
#   gh workflow run kanban-worker-claude.yml -f task=<n> -f attempt=<k> -f board=<slug>
#
# — after it has claimed refs/kb/locks/<n>/<k>, and the worker finishes with exactly one hkb terminal
# verb the way a local worker does.
#
# Secrets: KB_TOKEN (as in kanban-dispatch.yml) and ONE of CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token`, uses your subscription) or ANTHROPIC_API_KEY.
name: kanban worker (claude)

on:
  workflow_dispatch:
    inputs:
      task:
        description: hkb task number
        required: true
      attempt:
        description: attempt number — the lock ref is refs/kb/locks/<task>/<attempt>
        required: true
      board:
        description: board slug
        required: false
        default: "default"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Never cancel a worker: the attempt owns a lock ref, and only a terminal verb or the dispatcher's
# reclaim may end it.
concurrency:
  group: kb-worker-${{ inputs.task }}-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    # keep this at or under the board's max_runtime, or the dispatcher reclaims an attempt that is
    # still running and two workers end up on one task
    timeout-minutes: 60
    env:
      KB_TASK: ${{ inputs.task }}
      KB_ATTEMPT: ${{ inputs.attempt }}
      KB_BOARD: ${{ inputs.board }}
      KB_PROFILE: claude-action
      GH_TOKEN: ${{ secrets.KB_TOKEN }}
    steps:
      # fetch-depth 0: the heartbeat is a compare-and-swap on the lock ref, which needs real history
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `package-manager-cache: false`: as in kanban-dispatch.yml — this job puts `hkb` on PATH, not
      # your project's dependencies. setup-node's docs also recommend turning automatic caching off
      # in jobs with elevated privileges, and this one holds KB_TOKEN and `contents: write`.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: install hkb
        run: npm link

      # The brief is `hkb context <n>` — the same text a local worker is launched with. It quotes the
      # issue, so it goes into $GITHUB_OUTPUT behind a delimiter it cannot forge and is never
      # interpolated into a shell command.
      - id: brief
        name: hkb context
        run: |
          delim="hkb-eof-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            printf 'prompt<<%s\n' "$delim"
            hkb context "$KB_TASK"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.brief.outputs.prompt }}
          # set ONE of these two repository secrets — the other stays empty and is ignored
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Bash(hkb *),Bash(git *),Bash(gh pr *),Bash(gh issue view *),Bash(npm *),Bash(npx *),Bash(node *),Bash(cat *),Bash(ls *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(wc *),Bash(sed *),Bash(awk *),Bash(grep *),Bash(find *),Bash(diff *),Bash(cp *),Bash(mv *),Bash(touch *),Bash(chmod *),Bash(printf *),Bash(echo *),Bash(jq *),Bash(cd *),Bash(pwd *),Bash(true *),Bash(false *),Bash(test *),Bash([ *),Bash(env *),Bash(which *),Bash(command *),Bash(type *),Bash(sleep *),Bash(time *),Bash(set *),Bash(export *),Edit,Write,Read,Glob,Grep"
            --disallowedTools "Bash(hkb dispatch*),Bash(git push --force*),Bash(git push -f*)"
            --max-turns 80
        env:
          GH_TOKEN: ${{ secrets.KB_TOKEN }}

      # There is no Stop hook on a runner, so this is the enforcement: an attempt that ends without a
      # terminal verb is recorded as one here instead of sitting `running` until the stale reclaim.
      # `hkb unblock <n>` puts it back on the board.
      - name: enforce the terminal verb
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=$(hkb status "$KB_TASK" || echo unknown)
          echo "#$KB_TASK is $status"
          if [ "$status" = "running" ]; then
            hkb block "$KB_TASK" "the worker workflow ended without a terminal verb — $RUN_URL" --kind transient
          fi
