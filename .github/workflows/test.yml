name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # 22 is the floor `engines` claims, 24 is the recommended line. Two floors is a real signal — a
    # syntax or API that only exists on 24 has to fail somewhere — so this one is a matrix where the
    # single-version job above it was not.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7
      # `package-manager-cache: false` on every setup-node with a checkout behind it. v5 turned
      # caching on by default and v6 narrowed it to "package.json names npm in
      # packageManager/devEngines"; hkb has no dependencies and ships no lock file, so a cache would
      # have nothing to restore — and the restore *fails* the step when it finds no lock file. A
      # package.json edit is not supposed to be able to break CI, so this is pinned off rather than
      # left to depend on a field nothing else here cares about.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      # The only dependency is `typescript`, and only `npm run lint`'s type check needs it. `npm test`
      # and the CLI itself run with an empty node_modules — that is the point of the smoke job.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # Two runs in one job rather than a matrix: same signal, half the runners. UTC is what Actions
      # gives us and what most CI everywhere gives us; America/New_York is a contributor's laptop,
      # west of UTC and on DST. A date test that only holds in one of them is a flake waiting for a
      # bad day (#48).
      - run: npm test
        env:
          TZ: UTC
      - run: npm test
        env:
          TZ: America/New_York

  # `npm test` proves the source is right; this proves the tarball is. It packs hkb, installs the
  # tarball into an empty directory and runs the CLI from there, so a `files` entry that stops
  # shipping `skills/` or `templates/` fails here rather than on a stranger's first `npx hkb-cli init`.
  # It runs beside `test` rather than after it: two independent signals, and neither waits.
  #
  # On 22 and 26 on purpose: the floor `engines` claims and the current line — the two ends nothing
  # else checks (the `test` matrix covers 22 and 24 in between). That floor is about the node that runs
  # `hkb`, and is unrelated to the node the actions themselves run on; setup-node still installs any
  # version it is asked for. No `npm install` here on purpose either: the tarball must run with nothing
  # installed beside it, so `typescript` being a devDependency has to stay invisible to it.
  smoke:
    name: packed artifact (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: node scripts/smoke-pack.mjs

  # The two checks branch protection requires by name. A matrix cannot produce a single check — it
  # reports one per leg (`test (node 22)`, `test (node 24)`) — so adding the matrix in #289 silently
  # retired the `test` and `packed artifact` contexts `main` is protected on, and every PR after it
  # would have sat at "Required statuses must pass" with nothing left to report them. These gates keep
  # the contract stable whatever the matrix does next: they pass only if every leg passed, and
  # `always()` is what makes a skipped or cancelled leg fail them instead of being read as success.
  test-gate:
    name: test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - run: '[ "${{ needs.test.result }}" = "success" ] || exit 1'

  smoke-gate:
    name: packed artifact
    runs-on: ubuntu-latest
    needs: smoke
    if: always()
    steps:
      - run: '[ "${{ needs.smoke.result }}" = "success" ] || exit 1'
