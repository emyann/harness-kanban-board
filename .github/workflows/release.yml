# Publish hkb to npm. The trigger is a `v*` tag, so a release is one push and nothing else:
#
#   npm version patch && git push --follow-tags
#
# Two gates stand before the publish — the test suite, and the tag agreeing with package.json — and
# one job stands after it: a clean runner with no checkout that installs the version we just published
# straight from the registry and runs it. That last job is the only thing here that proves `npx hkb-cli`
# works for a stranger; everything before it only proves the repository is healthy.
#
# No secrets. npm publishes this package through a *trusted publisher* — an identity on npmjs.com bound
# to this repository and to this file by name — so the npm CLI trades the job's OIDC token for a
# short-lived publish credential and a provenance attestation, and nothing here reads a token. Renaming
# this workflow, or moving the publish into another one, breaks releases until the trusted publisher on
# npmjs.com is updated to match. See docs/releasing.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never two publishes of the same tag at once, and never cancel one in flight: a cancelled run can
# leave a version on the registry with no verify behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the whole authentication story: npm exchanges this OIDC token for a credential
    outputs:
      version: ${{ steps.gate.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      # No `registry-url`: that option exists only to write an `.npmrc` that reads `NODE_AUTH_TOKEN`,
      # and there is no token any more. registry.npmjs.org is npm's default, and the OIDC exchange
      # wants an unauthenticated npm to start from.
      #
      # `package-manager-cache: false` for the same reason it is off in test.yml — hkb has no lock
      # file to restore — and for one more that only applies here: this job holds `id-token: write`,
      # and setup-node's own docs say to turn automatic caching off in jobs with elevated privileges.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      # The same three runs test.yml does on every push: same signal, and a tag can point at a commit
      # that never went through a pull request.
      - run: npm run lint
      - run: npm test
        env:
          TZ: UTC
      - run: npm test
        env:
          TZ: America/New_York

      # test.yml runs this too, but this workflow does not depend on that one — it re-runs the suite
      # itself, so it has to re-run the smoke as well. Publishing a tarball that was never packed and
      # installed is exactly the failure this whole path exists to prevent.
      - run: npm run smoke

      # The tag is the version. If they disagree, the tag is a lie about what is being published, and
      # the publish would put the package.json version on the registry under a tag nobody can find.
      - id: gate
        name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} says ${tag} but package.json says ${pkg}. Set them to the same version, delete the tag (git push --delete origin ${GITHUB_REF_NAME}), and tag again."
            exit 1
          fi
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"

      # Trusted publishing is an exchange the npm CLI performs itself, and it only exists in npm
      # >= 11.5.1 on Node >= 22.14. Node 22 still bundles npm 10, so the runner's npm is upgraded here
      # rather than hoped for — and then both are checked, because an npm that quietly stayed on 10
      # fails later as "need auth", which points at a token that no longer exists.
      - id: runner
        name: node >= 22.14, npm >= 11.5.1
        run: |
          npm install -g npm@latest
          atleast() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          node="$(node -p 'process.versions.node')"
          npm="$(npm --version)"
          echo "node ${node}, npm ${npm}"
          if ! atleast 22.14.0 "$node"; then
            echo "::error::node ${node} is below 22.14.0, the floor npm trusted publishing documents. Raise node-version in .github/workflows/release.yml."
            exit 1
          fi
          if ! atleast 11.5.1 "$npm"; then
            echo "::error::npm ${npm} is below 11.5.1, so it cannot exchange this job's OIDC token for a publish credential — and there is no npm token to fall back on. 'npm install -g npm@latest' did not take; check the step above."
            exit 1
          fi

      # A fork has no trusted publisher on npmjs.com, and no token to fall back on: its exchange would
      # fail with a 404 that explains nothing. Say it once, publish nothing, and stay green — the tag
      # is fine, it is just not the repository npm trusts. Which repository that is, is the one
      # package.json already names, so it is not spelled out a second time here.
      - id: preflight
        name: this is the repository npm trusts
        run: |
          home="$(node -p "require('./package.json').repository.url.replace(/^.*github\.com[:/]/, '').replace(/\.git$/, '')")"
          if [ "$GITHUB_REPOSITORY" = "$home" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REPOSITORY} is not ${home}, so nothing was published — the tag and the tests are fine, this simply is not the repository npm publishes from. Publishing needs a trusted publisher on npmjs.com bound to ${home} and to release.yml; a fork has no such identity, and this workflow reads no npm token to fall back on. To release a fork, point package.json's repository at it and configure a trusted publisher for your own package name."
          fi

      # No `env:` and no secret: the credential comes from the OIDC exchange `id-token: write` above
      # makes possible, and so does the attestation. `--provenance` is belt and braces — package.json
      # sets publishConfig.provenance, so a publish that cannot attest fails rather than quietly
      # shipping unsigned, whether or not the flag is here.
      - id: publish
        if: steps.preflight.outputs.ready == 'true'
        name: npm publish
        run: |
          npm publish --provenance --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

  # No checkout, no npm link, no node_modules from this repo: this job knows nothing but the version
  # string. If it passes, `npx hkb-cli` works for someone who has never seen the repository.
  verify:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No cache flag here on purpose: with no checkout there is no package.json in the workspace,
      # so setup-node's automatic caching has nothing to detect and never engages.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A publish is not instantly readable from every registry edge, so retry — but loudly, and with
      # a bound: ten tries, 30s apart, is five minutes. Longer than that is not propagation, it is a
      # broken package, and the release should go red so the operator sees it.
      - name: npx hkb-cli@version
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -u
          for i in $(seq 1 10); do
            if out="$(npx -y "hkb-cli@${VERSION}" version 2>&1)"; then
              echo "$out"
              # `hkb version` prints "hkb <version>" and nothing after it, so match the tail — a
              # substring match would let hkb-cli@1.4.10 pass for a 1.4.1 release.
              case "$out" in
                *" ${VERSION}")
                  npx -y "hkb-cli@${VERSION}" help
                  echo "npx hkb-cli@${VERSION} runs, and reports ${VERSION}."
                  exit 0
                  ;;
                *)
                  echo "::error::npx hkb-cli@${VERSION} ran but reported: ${out}"
                  exit 1
                  ;;
              esac
            fi
            echo "attempt ${i}/10: npx failed, waiting 30s. Output was:"
            echo "$out" | tail -3
            sleep 30
          done
          echo "::error::hkb-cli@${VERSION} was published but 'npx -y hkb-cli@${VERSION} version' never succeeded in 5 minutes. Check https://www.npmjs.com/package/hkb-cli and the publish job's log."
          exit 1
