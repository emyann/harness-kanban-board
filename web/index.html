<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>hkb board</title>
<style>
:root {
  color-scheme: dark light;
  --bg: #0d1117; --panel: #141a22; --panel-2: #1a222c; --line: #263140; --line-soft: #1e2733;
  --fg: #e6edf3; --fg-dim: #9aa7b4; --fg-faint: #6b7887;
  --accent: #4493f8; --danger: #f85149; --ok: #3fb950; --warn: #d29922;
  --triage: #7d9fd6; --todo: #7fc08c; --ready: #3fb950; --running: #d29922;
  --blocked: #f0703c; --review: #a371f7; --done: #2fa8a0;
  --shadow: 0 8px 24px rgba(0,0,0,.45);
  --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa; --panel: #fff; --panel-2: #f6f8fa; --line: #d8dee4; --line-soft: #e6eaef;
    --fg: #1f2328; --fg-dim: #59636e; --fg-faint: #818b98;
    --accent: #0969da; --danger: #cf222e; --ok: #1a7f37; --warn: #9a6700;
    --triage: #4a72b8; --todo: #2f8a45; --ready: #1a7f37; --running: #9a6700;
    --blocked: #bc4c00; --review: #8250df; --done: #0b7a75;
    --shadow: 0 8px 24px rgba(31,35,40,.12);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
kbd { font: 11px/1 var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 4px; color: var(--fg-dim); }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 14px; flex: 0 0 auto;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 700; letter-spacing: .04em; font-family: var(--mono); }
.brand span { color: var(--fg-faint); font-weight: 400; }
.repo { color: var(--fg-dim); font-family: var(--mono); font-size: 12px; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--fg-dim); font-size: 11.5px; white-space: nowrap;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-faint); flex: 0 0 auto; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.warn { background: var(--warn); }
.dot.err { background: var(--danger); }
.btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--fg); font-size: 12px;
}
.btn:hover { border-color: var(--fg-faint); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.danger { color: var(--danger); }
[hidden] { display: none !important; }

/* ---------- board bar (only when this server holds more than one board) ---------- */
.boards {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 0 0 auto;
  padding: 7px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.bchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--fg-dim); font-size: 11.5px; white-space: nowrap;
}
.bchip:hover { border-color: var(--fg-faint); }
.bchip.on { border-color: var(--accent); color: var(--fg); }
.bchip .n { font-family: var(--mono); color: var(--fg-faint); }
.errors {
  flex: 0 0 auto; padding: 7px 16px; font-size: 12px; overflow-wrap: anywhere;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--danger) 14%, var(--panel));
}

/* ---------- board ---------- */
main { flex: 1 1 auto; display: flex; gap: 10px; padding: 12px; overflow-x: auto; overflow-y: hidden; }
.col {
  flex: 1 1 0; min-width: 218px; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden;
}
.col > h2 {
  margin: 0; padding: 9px 11px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--fg-dim); display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--line-soft);
}
.col > h2::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--col); }
.col .count { margin-left: auto; color: var(--fg-faint); font-weight: 400; letter-spacing: 0; }
.col-body { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.col.over { border-color: var(--col); }
.col.over .col-body { background: color-mix(in srgb, var(--col) 9%, transparent); }
.col.no-drop.over { border-color: var(--danger); }
.col.no-drop.over .col-body { background: color-mix(in srgb, var(--danger) 9%, transparent); }
.empty { color: var(--fg-faint); font-size: 11.5px; text-align: center; padding: 14px 6px; }

.card {
  background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--col);
  border-radius: 6px; padding: 8px 9px; cursor: grab; position: relative;
}
.card:hover { border-color: var(--fg-faint); border-left-color: var(--col); }
.card.dragging { opacity: .4; cursor: grabbing; }
.card.pending { opacity: .55; }
.card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.card .num { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }
.card .title { margin: 2px 0 6px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line);
  color: var(--fg-dim); font-family: var(--mono); white-space: nowrap;
}
.chip.agent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chip.prio { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.chip.dep.open { color: var(--blocked); border-color: color-mix(in srgb, var(--blocked) 45%, var(--line)); }
.chip.dep.done { color: var(--fg-faint); text-decoration: line-through; }
.chip.pr { color: var(--review); border-color: color-mix(in srgb, var(--review) 45%, var(--line)); }
.chip.repo { color: var(--fg-dim); background: var(--panel); }
.chip.human { color: #fff; background: var(--danger); border-color: transparent; }
.chip.sched { color: var(--fg-dim); }
.card.running-now .num::after {
  content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%;
  background: var(--running); animation: pulse 1.6s ease-in-out infinite; vertical-align: middle;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

/* ---------- drawer ---------- */
.drawer {
  position: fixed; inset: 0 0 0 auto; width: min(560px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .16s ease; z-index: 20;
}
.drawer.open { transform: none; }
.drawer header { background: transparent; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 0 16px 24px; }
.drawer h3 {
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-faint);
  margin: 20px 0 8px; font-weight: 600;
}
.drawer .title { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 14px 0 8px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.prose { color: var(--fg-dim); overflow-wrap: anywhere; }
.prose h4 { color: var(--fg); font-size: 13px; margin: 14px 0 4px; }
.prose ul { margin: 4px 0; padding-left: 18px; }
.prose code { font-family: var(--mono); font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 3px; }
.kv { font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
table.attempts { width: 100%; border-collapse: collapse; font-size: 11.5px; font-family: var(--mono); }
table.attempts th { text-align: left; color: var(--fg-faint); font-weight: 500; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line-soft); }
table.attempts td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; color: var(--fg-dim); }
table.attempts td.note { font-family: inherit; color: var(--fg); overflow-wrap: anywhere; }
.outcome { padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); }
.outcome.completed, .outcome.review_requested { color: var(--ok); }
.outcome.blocked, .outcome.crashed, .outcome.timed_out, .outcome.protocol_violation, .outcome.gave_up, .outcome.spawn_failed { color: var(--danger); }
.outcome.active { color: var(--running); }
pre.log {
  margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--fg-dim);
  background: #05080c; border: 1px solid var(--line-soft); border-radius: 6px;
  padding: 10px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
}
@media (prefers-color-scheme: light) { pre.log { background: #f6f8fa; } }
.blocker { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }

/* ---------- modal + toasts ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: grid; place-items: center; }
.modal { width: min(460px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.modal h3 { margin: 0 0 4px; font-size: 14px; }
.modal p { margin: 0 0 12px; color: var(--fg-dim); font-size: 12px; }
.modal label { display: block; font-size: 11px; color: var(--fg-faint); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .07em; }
.modal textarea, .modal select, .modal input {
  width: 100%; font: inherit; color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
}
.modal textarea { min-height: 84px; resize: vertical; }
.modal .actions { justify-content: flex-end; margin-top: 16px; }
#toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 40; max-width: min(420px, calc(100vw - 28px)); }
.toast {
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 9px 12px; box-shadow: var(--shadow); font-size: 12px; overflow-wrap: anywhere;
}
.toast.err { border-left-color: var(--danger); }
.toast.ok { border-left-color: var(--ok); }
.toast .h { font-weight: 600; margin-bottom: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header>
  <div class="brand">hkb <span>board</span></div>
  <div class="repo" id="repo">connecting…</div>
  <div class="spacer"></div>
  <div class="pill" id="dispatcher" title="Is a `hkb dispatch --loop` running on this repo?"><i class="dot"></i><span>dispatcher</span></div>
  <div class="pill" id="freshness" title="Last successful board read"><i class="dot" id="conn"></i><span id="ago">—</span></div>
  <button class="btn" id="refresh" title="Refresh now (r)">Refresh</button>
</header>

<nav class="boards" id="boards" hidden aria-label="Boards"></nav>
<div class="errors" id="board-errors" hidden role="status"></div>

<main id="board"></main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <div class="repo" id="d-num">—</div>
    <div class="spacer"></div>
    <a class="btn" id="d-gh" target="_blank" rel="noreferrer noopener">GitHub ↗</a>
    <button class="btn" id="d-close" title="Close (Esc)">Close</button>
  </header>
  <div class="drawer-body" id="d-body"></div>
</aside>

<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
const COLS = ['triage','todo','ready','running','blocked','review','done'];
const COL_LABEL = { triage:'Triage', todo:'Todo', ready:'Ready', running:'Running', blocked:'Blocked', review:'Review', done:'Done' };

const state = {
  boards: [],         // one entry per board on this server, from the last /api/board payload
  etag: null,
  poll: 30,
  fetchedAt: 0,
  filter: null,       // board key the page is narrowed to, or null for all of them
  selected: null,     // { key, n } — the task the drawer shows; #12 on two boards is two tasks
  detail: null,       // last task-detail payload
  logAttempt: null,   // attempt whose log the drawer shows
  dragging: null,     // { key, n } being dragged
  pending: new Set(), // "key#n" with an in-flight verb
  modalOpen: false,
  online: true,
};

// ---------- boards ----------
// Every read and every verb is addressed by board key: a card dragged in one board's column must
// never run a verb against another repo, so the key travels with the card, not with the page.
const cardId = (key, n) => key + '#' + n;
const parseCardId = (s) => { const m = /^(.+)#(\d+)$/.exec(String(s || '')); return m ? { key: m[1], n: Number(m[2]) } : null; };
const boardOf = (key) => state.boards.find((b) => b.key === key) || null;
const taskIn = (key, n) => (boardOf(key)?.tasks || []).find((t) => t.number === n) || null;
const visibleBoards = () => (state.filter ? state.boards.filter((b) => b.key === state.filter) : state.boards);
const multi = () => state.boards.length > 1;
const boardLabel = (b) => (b ? b.repo + (b.board === 'default' ? '' : ' · board "' + b.board + '"') : '');
const shortLabel = (b) => (b ? b.repo.split('/').pop() + (b.board === 'default' ? '' : ' · ' + b.board) : '');
const taskPath = (key, n, suffix) => '/api/boards/' + encodeURIComponent(key) + '/tasks/' + n + (suffix || '');

// ---------- tiny helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

function ago(iso) {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

function toast(title, body, kind) {
  const node = el('<div class="toast ' + (kind || '') + '"><div class="h">' + esc(title) + '</div><div>' + esc(body || '') + '</div></div>');
  $('#toasts').append(node);
  setTimeout(() => { node.style.opacity = '0'; node.style.transition = 'opacity .3s'; setTimeout(() => node.remove(), 320); }, kind === 'err' ? 9000 : 4500);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 304) return { notModified: true, etag: res.headers.get('etag') };
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* keep the raw text below */ }
  if (!res.ok) {
    const err = new Error(json?.error || text.slice(0, 300) || (res.status + ' ' + res.statusText));
    err.status = res.status; err.needs = json?.needs; err.refused = json?.refused;
    throw err;
  }
  return { json, etag: res.headers.get('etag') };
}

const post = (key, n, verb, body) => api(taskPath(key, n, '/' + verb), {
  method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}),
});

// ---------- markdown-lite (issue bodies are ours, but never trust them into innerHTML) ----------
function mdLite(text) {
  const lines = String(text || '').split(/\r?\n/);
  let out = '', inList = false, inCode = false;
  // These run on already-escaped text, so `<` and `"` exist only as entities: the URL class can be
  // generous (an `&amp;` really is part of the link) without ever letting markup out of an attribute.
  const link = (u) => {
    const trail = /[.,;:!?]+$/.exec(u);
    const href = trail ? u.slice(0, -trail[0].length) : u;
    return '<a href="' + href + '" target="_blank" rel="noreferrer noopener">' + href + '</a>' + (trail ? trail[0] : '');
  };
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\bhttps?:\/\/[^\s()<>]+/g, link)
    .replace(/(^|\s)#(\d+)\b/g, (m, pre, n) => pre + '<a href="#" data-open="' + n + '">#' + n + '</a>');
  for (const raw of lines) {
    if (/^```/.test(raw)) { inCode = !inCode; out += inCode ? '<pre class="kv">' : '</pre>'; continue; }
    if (inCode) { out += esc(raw) + '\n'; continue; }
    const li = /^\s*[-*]\s+(.*)$/.exec(raw);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(li[1]) + '</li>'; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const h = /^(#{1,6})\s+(.*)$/.exec(raw);
    if (h) { out += '<h4>' + inline(h[2]) + '</h4>'; continue; }
    if (!raw.trim()) { out += '<div style="height:6px"></div>'; continue; }
    out += '<p style="margin:2px 0">' + inline(raw) + '</p>';
  }
  if (inList) out += '</ul>';
  if (inCode) out += '</pre>';
  return out;
}

// ---------- board rendering ----------
function buildColumns() {
  const board = $('#board');
  board.innerHTML = '';
  for (const c of COLS) {
    const col = el(
      '<section class="col" data-col="' + c + '" style="--col: var(--' + c + ')">' +
        '<h2>' + COL_LABEL[c] + '<span class="count" data-count>0</span></h2>' +
        '<div class="col-body" data-body></div>' +
      '</section>');
    col.addEventListener('dragover', (e) => {
      if (state.dragging == null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('over');
      // The card says which board it came from; the page never assumes "the" board.
      const from = parseCardId(e.dataTransfer.getData('text/plain')) || state.dragging;
      if (from) moveTask(from.key, from.n, c);
    });
    board.append(col);
  }
}

function cardHtml(t, board) {
  const chips = [];
  if (board) chips.push('<span class="chip repo" title="' + esc(boardLabel(board)) + '">' + esc(shortLabel(board)) + '</span>');
  if (t.agent) chips.push('<span class="chip agent">' + esc(t.agent) + '</span>');
  if (t.priority) chips.push('<span class="chip prio">p' + t.priority + '</span>');
  for (const b of t.blockedBy) chips.push('<span class="chip dep ' + (b.done ? 'done' : 'open') + '" title="' + esc(b.title || '') + '">#' + b.number + (b.done ? '✓' : '') + '</span>');
  for (const p of t.prs) {
    if (p.state === 'CLOSED' && !p.merged) continue;
    const label = 'PR #' + p.number + (p.merged ? ' merged' : p.isDraft ? ' draft' : '');
    chips.push('<a class="chip pr" href="' + esc(p.url) + '" target="_blank" rel="noreferrer noopener" data-stop>' + esc(label) + '</a>');
  }
  if (t.scheduled_at && new Date(t.scheduled_at) > new Date()) chips.push('<span class="chip sched">⏱ ' + esc(t.scheduled_at.slice(0, 16).replace('T', ' ')) + '</span>');
  if (t.needsHuman) chips.push('<span class="chip human">needs human</span>');
  return '<div class="num">#' + t.number + '</div>' +
    '<div class="title">' + esc(t.title) + '</div>' +
    (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '');
}

function makeCard(b, t, c) {
  const card = el('<article class="card" tabindex="0"></article>');
  card.style.setProperty('--col', 'var(--' + c + ')');
  card.dataset.card = cardId(b.key, t.number);
  card.dataset.board = b.key;
  card.dataset.n = t.number;
  card.draggable = true;
  card.innerHTML = cardHtml(t, multi() ? b : null);
  if (c === 'running') card.classList.add('running-now');
  if (state.pending.has(cardId(b.key, t.number))) card.classList.add('pending');
  if (state.selected && state.selected.key === b.key && state.selected.n === t.number) card.classList.add('selected');
  card.addEventListener('dragstart', (e) => {
    state.dragging = { key: b.key, n: t.number };
    e.dataTransfer.setData('text/plain', cardId(b.key, t.number));
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
    markDropTargets(t);
  });
  card.addEventListener('dragend', () => {
    state.dragging = null;
    card.classList.remove('dragging');
    document.querySelectorAll('.col').forEach((x) => x.classList.remove('over', 'no-drop'));
  });
  card.addEventListener('click', (e) => { if (!e.target.closest('[data-stop]')) openDrawer(b.key, t.number); });
  card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(b.key, t.number); } });
  return card;
}

/** The header, the board bar and the error strip — everything that is about boards, not tasks. */
function renderHeader() {
  const bs = state.boards;
  const one = bs.length === 1 ? bs[0] : null;
  $('#repo').textContent = one ? one.repo + ' · board "' + one.board + '"' : bs.length + ' boards';
  $('#repo').title = bs.map((b) => boardLabel(b) + '  ' + b.root).join('\n');
  document.title = 'hkb · ' + (one ? one.repo : bs.length + ' boards');

  const up = bs.filter((b) => b.dispatcher && b.dispatcher.running);
  const disp = $('#dispatcher');
  disp.querySelector('.dot').className = 'dot' + (!up.length ? '' : up.length === bs.length ? ' on' : ' warn');
  disp.querySelector('span').textContent = one
    ? (one.dispatcher.running ? 'dispatcher up (pid ' + one.dispatcher.pid + ')' : 'no dispatcher loop')
    : 'dispatchers ' + up.length + '/' + bs.length;
  disp.title = bs.map((b) => boardLabel(b) + ': ' + (b.dispatcher && b.dispatcher.running ? 'dispatcher pid ' + b.dispatcher.pid : 'no dispatcher loop')).join('\n');

  // One chip per board — its own dispatcher dot, its own count — and a click to narrow the page to it.
  const bar = $('#boards');
  bar.hidden = !multi();
  if (multi()) {
    const chips = [{ key: null, label: 'All', count: bs.reduce((n, b) => n + b.tasks.length, 0), dot: '', title: 'Every board' }]
      .concat(bs.map((b) => ({
        key: b.key,
        label: shortLabel(b),
        count: b.tasks.length,
        dot: b.error ? ' err' : b.dispatcher && b.dispatcher.running ? ' on' : '',
        title: boardLabel(b) + ' · ' + b.root + (b.error ? '\n' + b.error : ''),
      })));
    bar.innerHTML = '';
    for (const c of chips) {
      const chip = el('<button class="bchip' + (state.filter === c.key ? ' on' : '') + '" title="' + esc(c.title) + '">' +
        '<i class="dot' + c.dot + '"></i><span>' + esc(c.label) + '</span><span class="n">' + c.count + '</span></button>');
      chip.addEventListener('click', () => { state.filter = c.key; renderBoard(); });
      bar.append(chip);
    }
  }

  // A board that failed to read says so and keeps its last good cards — it never blanks the others.
  const bad = bs.filter((b) => b.error);
  const strip = $('#board-errors');
  strip.hidden = !bad.length;
  strip.innerHTML = bad.map((b) => '<div>' + esc(boardLabel(b)) + ' — ' + esc(b.error) +
    (b.stale ? ' <span style="color:var(--fg-dim)">(showing the last good read)</span>' : '') + '</div>').join('');
}

function renderBoard() {
  if (!state.boards.length) return;
  renderHeader();
  const byCol = Object.fromEntries(COLS.map((c) => [c, []]));
  for (const b of visibleBoards()) for (const t of b.tasks) if (byCol[t.status]) byCol[t.status].push({ b, t });

  for (const c of COLS) {
    const col = $('.col[data-col="' + c + '"]');
    const body = $('[data-body]', col);
    const scroll = body.scrollTop;
    $('[data-count]', col).textContent = byCol[c].length;
    body.innerHTML = '';
    if (!byCol[c].length) body.append(el('<div class="empty">—</div>'));
    for (const { b, t } of byCol[c]) body.append(makeCard(b, t, c));
    body.scrollTop = scroll;
  }
  tickFreshness();
}

/** Client-side hint only — the server decides, and refuses with a reason. */
const LEGAL = {
  triage: ['todo','ready','blocked'], todo: ['ready','blocked'], ready: ['blocked'],
  running: ['blocked'], blocked: ['ready','todo'], review: ['ready','todo','blocked'], done: [],
};
function markDropTargets(t) {
  const legal = LEGAL[t.status] || [];
  document.querySelectorAll('.col').forEach((col) => {
    const c = col.dataset.col;
    col.classList.toggle('no-drop', c !== t.status && !legal.includes(c));
  });
}

function tickFreshness() {
  $('#ago').textContent = state.fetchedAt ? ago(new Date(state.fetchedAt).toISOString()) : '—';
  $('#conn').className = 'dot ' + (!state.online ? 'err' : Date.now() - state.fetchedAt > (state.poll + 20) * 1000 ? 'warn' : 'on');
}

// ---------- data ----------
let inflight = null;
/** One board read at a time. A forced refresh (after a verb) queues behind the poll instead of dropping. */
function refresh(force) {
  if (inflight) return force ? inflight.then(() => refresh(true), () => refresh(true)) : inflight;
  inflight = doRefresh(force).finally(() => { inflight = null; });
  return inflight;
}

async function doRefresh(force) {
  try {
    const r = await api('/api/board' + (force ? '?refresh=1' : ''), { headers: state.etag && !force ? { 'if-none-match': state.etag } : {} });
    state.online = true;
    if (!r.notModified) {
      state.boards = r.json.boards || [];
      state.etag = r.etag;
      state.poll = r.json.poll || 30;
      if (state.filter && !boardOf(state.filter)) state.filter = null; // a board left the server
      renderBoard();
    }
    state.fetchedAt = Date.now();
    tickFreshness();
    if (state.selected) loadDetail(state.selected.key, state.selected.n, force);
  } catch (e) {
    state.online = false;
    tickFreshness();
    toast('Board read failed', e.message, 'err');
  }
}

// ---------- verbs ----------
/** Every verb is addressed by (board key, number): the repo it lands on is the card's, always. */
async function run(key, n, verb, body, label) {
  const id = cardId(key, n);
  const where = multi() ? ' · ' + shortLabel(boardOf(key)) : '';
  state.pending.add(id);
  document.querySelectorAll('.card[data-card="' + id + '"]').forEach((c) => c.classList.add('pending'));
  let incomplete = false;
  try {
    const { json } = await post(key, n, verb, body);
    const note = json.landed || json.note;
    toast('#' + n + ' → ' + (json.status || 'ok') + where, note || (label || verb), 'ok');
    return json;
  } catch (e) {
    if (e.needs && e.needs.length) { incomplete = true; throw e; } // the caller collects the fields and retries
    toast((e.refused ? 'Move refused' : 'hkb ' + verb + ' failed') + where, e.message, 'err');
    return null;
  } finally {
    state.pending.delete(id);
    // Nothing was written when the verb was incomplete, so do not spend a board read on it.
    if (!incomplete) { state.etag = null; await refresh(true); }
  }
}

async function moveTask(key, n, to) {
  const t = taskIn(key, n);
  if (!t || t.status === to) return;
  // optimistic: put the card in the target column while the verb runs
  const card = document.querySelector('.card[data-card="' + cardId(key, n) + '"]');
  const target = $('.col[data-col="' + to + '"] [data-body]');
  if (card && target) { card.classList.add('pending'); target.prepend(card); }
  try {
    await run(key, n, 'move', { to }, 'moved to ' + to);
  } catch (e) {
    const need = e.needs || [];
    const extra = await askFor(need, n, t.status, to);
    if (!extra) { renderBoard(); return; }
    try { await run(key, n, 'move', { to, ...extra }, 'moved to ' + to); }
    catch (e2) { toast('Move refused', e2.message, 'err'); renderBoard(); }
  }
}

// ---------- modal ----------
function modal({ title, hint, fields = [], submit, danger }) {
  return new Promise((resolve) => {
    state.modalOpen = true;
    const body = fields.map((f) => '<label for="f-' + f.name + '">' + esc(f.label) + '</label>' + (f.kind === 'select'
      ? '<select id="f-' + f.name + '">' +
        f.options.map((o) => '<option value="' + esc(o) + '"' + (o === f.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
      : '<textarea id="f-' + f.name + '" placeholder="' + esc(f.placeholder || '') + '"></textarea>')).join('');
    const scrim = el('<div class="scrim"><form class="modal">' +
      '<h3>' + esc(title) + '</h3>' + (hint ? '<p>' + esc(hint) + '</p>' : '') + body +
      '<div class="actions"><button type="button" class="btn" data-cancel>Cancel</button>' +
      '<button type="submit" class="btn primary' + (danger ? ' danger' : '') + '">' + esc(submit) + '</button></div></form></div>');
    const close = (value) => { state.modalOpen = false; scrim.remove(); resolve(value); };
    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(null); });
    $('[data-cancel]', scrim).addEventListener('click', () => close(null));
    scrim.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } });
    $('form', scrim).addEventListener('submit', (e) => {
      e.preventDefault();
      const out = {};
      for (const f of fields) out[f.name] = $('#f-' + f.name, scrim).value.trim();
      if (fields.some((f) => f.kind !== 'select' && !out[f.name])) return;
      close(out);
    });
    document.body.append(scrim);
    scrim.querySelector('textarea, select')?.focus();
  });
}

const BLOCK_KINDS = ['needs_input', 'dependency', 'capability', 'transient', 'generic'];

/** Collect whatever the server said the verb still needs. */
function askFor(needs, n, from, to) {
  if (needs.includes('reason') && to === 'blocked') {
    return modal({
      title: 'Block #' + n, hint: 'Recorded on the issue and shown to the next worker.', submit: 'Block',
      fields: [{ name: 'reason', label: 'Why is it blocked?', placeholder: 'needs the Stripe test key' },
               { name: 'kind', label: 'Kind', kind: 'select', options: BLOCK_KINDS, value: 'needs_input' }],
    });
  }
  if (needs.includes('reason')) {
    return modal({
      title: 'Request changes on #' + n, hint: 'Sends #' + n + ' back from review to ' + to + '.', submit: 'Request changes',
      fields: [{ name: 'reason', label: 'What must change?', placeholder: 'the tests do not cover the 422 path' }],
    });
  }
  return Promise.resolve(null);
}

// ---------- drawer ----------
async function openDrawer(key, n) {
  state.selected = { key, n };
  state.logAttempt = null;
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#d-num').textContent = '#' + n + (multi() ? ' · ' + shortLabel(boardOf(key)) : '');
  $('#d-body').innerHTML = '<p class="prose" style="margin-top:20px">loading…</p>';
  document.querySelectorAll('.card.selected').forEach((c) => c.classList.remove('selected'));
  document.querySelector('.card[data-card="' + cardId(key, n) + '"]')?.classList.add('selected');
  await loadDetail(key, n, true);
}

function closeDrawer() {
  state.selected = null; state.detail = null; state.logAttempt = null;
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  document.querySelectorAll('.card.selected').forEach((c) => c.classList.remove('selected'));
}

const showing = (key, n) => !!state.selected && state.selected.key === key && state.selected.n === n;

async function loadDetail(key, n, force) {
  try {
    const { json } = await api(taskPath(key, n, force ? '?refresh=1' : ''));
    if (!showing(key, n)) return;
    state.detail = json;
    renderDrawer(json);
  } catch (e) {
    if (showing(key, n)) $('#d-body').innerHTML = '<p class="prose" style="margin-top:20px">' + esc(e.message) + '</p>';
  }
}

function renderDrawer(t) {
  $('#d-gh').href = t.url;
  // A running task is the one you actually want to watch — open its log without a click.
  if (state.logAttempt == null && t.status === 'running' && t.logs.length) state.logAttempt = t.logs[t.logs.length - 1].attempt;
  const parts = [];
  parts.push('<div class="title">' + esc(t.title) + '</div>');

  const chips = ['<span class="chip" style="color:var(--' + t.status + ')">' + esc(t.status) + '</span>'];
  if (multi()) chips.push('<span class="chip repo">' + esc(boardLabel(boardOf(t.key)) || t.repo) + '</span>');
  if (t.agent) chips.push('<span class="chip agent">' + esc(t.agent) + '</span>');
  chips.push('<span class="chip prio">p' + t.priority + '</span>');
  if (t.needsHuman) chips.push('<span class="chip human">needs human</span>');
  for (const p of t.prs) chips.push('<a class="chip pr" href="' + esc(p.url) + '" target="_blank" rel="noreferrer noopener">PR #' + p.number + (p.merged ? ' merged' : p.isDraft ? ' draft' : ' open') + '</a>');
  parts.push('<div class="chips">' + chips.join('') + '</div>');

  parts.push('<div class="actions">' + [
    ['promote', 'Promote'], ['unblock', 'Unblock'], ['block', 'Block'],
    ['request-changes', 'Request changes'], ['comment', 'Comment'], ['archive', 'Archive'],
  ].map(([v, label]) => '<button class="btn' + (v === 'archive' ? ' danger' : '') + '" data-verb="' + v + '">' + label + '</button>').join('') + '</div>');

  if (t.blockedBy.length) {
    parts.push('<h3>Blocked by</h3>' + t.blockedBy.map((b) =>
      '<div class="blocker"><span class="chip dep ' + (b.done ? 'done' : 'open') + '">#' + b.number + (b.done ? '✓' : '') + '</span>' +
      '<a href="#" data-open="' + b.number + '">' + esc(b.title || 'issue #' + b.number) + '</a></div>').join(''));
  }
  if (t.parents.length && t.parents.some((p) => p.summary)) {
    parts.push('<h3>Parent results</h3>' + t.parents.filter((p) => p.summary).map((p) =>
      '<div class="prose"><strong>#' + p.number + '</strong> ' + esc(p.summary) + '</div>').join(''));
  }

  parts.push('<h3>Description</h3><div class="prose">' + (t.bodyText.trim() ? mdLite(t.bodyText) : '<em>(no description)</em>') + '</div>');
  parts.push('<h3>kb block</h3><div class="kv">' + esc(JSON.stringify(t.kb)) + '</div>');

  const attempts = t.run?.attempts || [];
  if (attempts.length) {
    parts.push('<h3>Attempts · ' + attempts.length + ' · failures ' + (t.run.failures || 0) + '</h3>' +
      '<table class="attempts"><thead><tr><th>#</th><th>profile</th><th>started</th><th>ended</th><th>outcome</th></tr></thead><tbody>' +
      attempts.map((a) => {
        const note = a.summary || a.reason || '';
        const sub = [note ? esc(note) : '', a.session ? '<span style="color:var(--fg-faint)">' + esc(a.session) + '</span>' : '',
          a.resume ? '<code>' + esc(a.resume) + '</code>' : ''].filter(Boolean);
        return '<tr><td>' + a.attempt + '</td><td>' + esc(a.profile || '') + '</td><td>' + esc(ago(a.started_at)) + '</td>' +
          '<td>' + (a.ended_at ? esc(ago(a.ended_at)) : '—') + '</td>' +
          '<td><span class="outcome ' + esc(a.outcome || 'active') + '">' + esc(a.outcome || 'active') + '</span></td></tr>' +
          (sub.length ? '<tr><td></td><td colspan="4" class="note">' + sub.join('<br>') + '</td></tr>' : '');
      }).join('') + '</tbody></table>');
  }

  if (t.result) {
    const m = t.result.metadata || {};
    parts.push('<h3>Latest result</h3><div class="prose">' + mdLite(t.result.summary || '') + '</div>');
    for (const [k, label] of [['changed_files', 'Changed files'], ['verification', 'Verification'], ['residual_risk', 'Residual risk']]) {
      if (m[k]?.length) parts.push('<div class="prose" style="margin-top:6px"><strong>' + label + ':</strong> ' + m[k].map((x) => '<code>' + esc(x) + '</code>').join(' ') + '</div>');
    }
  }

  if (t.logs.length) {
    parts.push('<h3>Worker log</h3><div class="actions" style="margin:0 0 8px">' + t.logs.map((l) =>
      '<button class="btn' + (state.logAttempt === l.attempt ? ' primary' : '') + '" data-log="' + l.attempt + '">attempt ' + l.attempt + '</button>').join('') +
      '</div><div id="d-log"></div>');
  }

  $('#d-body').innerHTML = parts.join('');
  $('#d-body').querySelectorAll('[data-verb]').forEach((b) => b.addEventListener('click', () => drawerVerb(t, b.dataset.verb)));
  $('#d-body').querySelectorAll('[data-log]').forEach((b) => b.addEventListener('click', () => showLog(t.key, t.number, Number(b.dataset.log))));
  // An issue reference in a body or a blocker is a task on the same board — never on another repo's.
  $('#d-body').querySelectorAll('[data-open]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); openDrawer(t.key, Number(a.dataset.open)); }));
  if (state.logAttempt) showLog(t.key, t.number, state.logAttempt);
}

async function drawerVerb(t, verb) {
  let body = {};
  if (verb === 'block') {
    body = await modal({
      title: 'Block #' + t.number, hint: 'hkb block — recorded on the issue and shown to the next worker.', submit: 'Block',
      fields: [{ name: 'reason', label: 'Why is it blocked?', placeholder: 'needs the Stripe test key' },
               { name: 'kind', label: 'Kind', kind: 'select', options: BLOCK_KINDS, value: 'needs_input' }],
    });
  } else if (verb === 'request-changes') {
    body = await modal({
      title: 'Request changes on #' + t.number, hint: 'Sends the task back to the board for another attempt.', submit: 'Request changes',
      fields: [{ name: 'reason', label: 'What must change?', placeholder: 'the tests do not cover the 422 path' }],
    });
  } else if (verb === 'comment') {
    body = await modal({ title: 'Comment on #' + t.number, hint: 'Posted as an issue comment.', submit: 'Comment',
      fields: [{ name: 'text', label: 'Comment', placeholder: 'the API key is in 1Password' }] });
  } else if (verb === 'archive') {
    const ok = await modal({ title: 'Archive #' + t.number + '?', danger: true, submit: 'Archive',
      hint: 'hkb archive closes the issue on GitHub and takes it off the board.' });
    if (!ok) return;
    body = {};
  }
  if (!body) return;
  await run(t.key, t.number, verb, body);
}

async function showLog(key, n, attempt) {
  state.logAttempt = attempt;
  const host = $('#d-log');
  if (!host) return;
  $('#d-body').querySelectorAll('[data-log]').forEach((b) => b.classList.toggle('primary', Number(b.dataset.log) === attempt));
  try {
    const { json } = await api(taskPath(key, n, '/log?attempt=' + attempt));
    host.innerHTML = '<div class="prose" style="margin-bottom:6px"><code>' + esc(json.path) + '</code> · ' +
      (json.size / 1024).toFixed(1) + ' KB' + (json.truncated ? ' · showing the tail' : '') + '</div>' +
      '<pre class="log">' + esc(json.text || '(empty)') + '</pre>';
    const pre = $('pre.log', host);
    pre.scrollTop = pre.scrollHeight;
  } catch (e) {
    host.innerHTML = '<div class="prose">' + esc(e.message) + '</div>';
  }
}

// ---------- wiring ----------
buildColumns();
$('#refresh').addEventListener('click', () => refresh(true));
$('#d-close').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (state.modalOpen) return;
  if (e.key === 'Escape' && state.selected) closeDrawer();
  if (e.key === 'r' && !e.metaKey && !e.ctrlKey && e.target === document.body) refresh(true);
});
// The poll cadence comes from the server (`--poll`), so one interval is the whole liveness story:
// a conditional GET that the server answers 304 unless the board actually changed.
(function pollLoop() {
  setTimeout(() => {
    if (!state.dragging && !state.modalOpen && !document.hidden) refresh(false);
    pollLoop();
  }, Math.max(5, state.poll) * 1000);
})();
setInterval(tickFreshness, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
refresh(true);
</script>
